; PlatformIO Project Configuration File for Life-OS Pocket Assistant
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; -------------------------------------------------------------
; Entorno 1: ESP32 Clásico (ESP32-WROOM-32 / DevKit v1 / NodeMCU-32)
; -------------------------------------------------------------
[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
build_flags =
    -D BOARD_ESP32_WROOM=1
    -D CORE_DEBUG_LEVEL=3 ; Info level
board_build.partitions = min_spiffs.csv

; -------------------------------------------------------------
; Entorno 2: ESP32-S3 (ESP32-S3-DevKitC-1 / N8R2 / N16R8)
; -------------------------------------------------------------
[env:esp32s3]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
build_flags =
    -D BOARD_ESP32_S3=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
board_build.partitions = default_8MB.csv

